<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voyago Tours</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-background text-foreground">
    <!-- Header -->
    <header class="border-b">
        <div class="mx-auto flex w-full max-w-5xl flex-wrap items-center justify-between gap-3 px-6 py-4">
            <a href="/" class="font-semibold tracking-tight">
                Voyago Tours
            </a>
            <nav class="flex items-center gap-4 text-sm">
                <a href="/packages" class="text-muted-foreground hover:text-foreground">
                    Paket Tour
                </a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex flex-1 flex-col">
        <div class="flex flex-1 flex-col items-center justify-center gap-6 px-6 py-32 text-center">
            <h1 class="text-4xl font-semibold tracking-tight">Voyago Tours</h1>
            <p class="max-w-md text-muted-foreground">
                Rencanakan perjalananmu berikutnya bersama Voyago Tours — paket
                lengkap, harga transparan, jadwal fleksibel.
            </p>
            <button class="bg-primary text-primary-foreground px-4 py-2 rounded hover:opacity-90 transition">
                Lihat Paket Tour
            </button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t">
        <div class="mx-auto w-full max-w-5xl px-6 py-6 text-center text-xs text-muted-foreground">
            © 2026 Voyago Tours. Proyek demo, bukan agen perjalanan sungguhan.
        </div>
    </footer>
</body>
</html>
